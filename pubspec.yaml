name: singcast
description: A multi-platform Clash client.
publish_to: "none"
version: 1.3.0-beta

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  signals_flutter: ^7.1.0

  # 路由
  go_router: ^18.0.2

  # JSON
  json_annotation: ^4.12.0

  # 桌面端
  window_manager: ^0.5.2
  desktop_lifecycle: ^0.1.2
  local_notifier: ^0.1.6

  # 国际化
  slang: ^4.19.2
  slang_flutter: ^4.19.0
  flutter_localizations:
    sdk: flutter

  # 工具
  win32: ^6.4.0
  win32_registry: ^3.0.3
  ffi: ^2.2.0
  file_picker: ^13.1.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  url_launcher: ^6.3.3
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  path: ^1.9.1
  # intl 版本由 flutter_localizations（SDK）锁定，不可自行升级。
  intl: ^0.20.3
  timeago: ^3.7.1

  # UI
  cupertino_icons: ^2.0.0
  flutter_staggered_grid_view: ^0.7.0
  desktop_tray: ^2026.6.25
  yaml: ^3.1.4
  flutter_svg: ^2.3.0
  dart_ipc: ^2.0.2
  app_links: ^7.2.2


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  slang_build_runner: ^4.19.0
  json_serializable: ^6.14.1
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

dependency_overrides:
  # jni 1.0.1+ 移除了桌面端 JNIEnv** 到 void** 的转换，
  # Linux clang 22 会将 incompatible pointer types 视为错误。
  jni: 1.0.0
  # jni_flutter 1.0.4 生成的版本校验要求 jni ^1.1.0，与上面的 jni 1.0.0
  # 冲突导致桌面/移动端构建失败；1.0.3 仍按 jni 1.0.x 生成。
  jni_flutter: 1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1C1B1F"
  image: assets/logo_splash.png
  android_12:
    image: assets/logo_android12_splash.png
    color: "#FFFFFF"
    color_dark: "#1C1B1F"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_padded.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon_padded.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
