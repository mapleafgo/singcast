name: singcast
description: A multi-platform Clash client.
publish_to: "none"
version: 1.2.3

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  signals_flutter: ^7.1.0

  # 路由
  go_router: ^18.0.0

  # JSON
  json_annotation: ^4.12.0

  # 桌面端
  window_manager: ^0.5.1
  desktop_lifecycle: ^0.1.1
  local_notifier: ^0.1.6

  # 国际化
  slang: ^4.15.0
  slang_flutter: ^4.15.0
  flutter_localizations:
    sdk: flutter

  # 工具
  win32: ^6.3.0
  win32_registry: ^3.0.3
  ffi: ^2.1.0
  file_picker: ^12.1.1
  package_info_plus: ^10.1.0
  pub_semver: ^2.2.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  share_plus: ^13.1.0
  path: ^1.9.0
  intl: ^0.20.2
  timeago: ^3.7.1

  # UI
  cupertino_icons: ^1.0.9
  flutter_staggered_grid_view: ^0.7.0
  desktop_tray: ^2026.4.19
  yaml: ^3.1.3
  flutter_svg: ^2.3.0
  dart_ipc: ^2.0.0
  app_links: ^7.1.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  slang_build_runner: ^4.15.0
  json_serializable: ^6.9.0
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  # jni 1.0.1+ 移除了桌面端 JNIEnv** 到 void** 的转换，
  # Linux clang 22 会将 incompatible pointer types 视为错误。
  jni: 1.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: NotoColorEmoji
      fonts:
        - asset: assets/fonts/NotoColorEmoji-Regular.ttf

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#1C1B1F"
  image: assets/logo_splash.png
  android_12:
    image: assets/logo_android12_splash.png
    color: "#FFFFFF"
    color_dark: "#1C1B1F"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_padded.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_padded.png"
  remove_alpha_ios: true
  macos:
    generate: true
    image_path: "assets/icon_padded.png"
  windows:
    generate: true
    image_path: "assets/icon.png"
